name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Pierce County refreshes its assessor data downloads weekly; rebuild the extract Mondays.
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:single
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r index.html css js data vendor site/
          cp dist/index.html site/standalone.html
      - name: Build Pierce County assessor extract (legal owner, sales, values)
        # The county's weekly bulk files are fetched from GitHub's runners into a scratch
        # directory; only a complete build replaces the extract in the site.
        id: extract
        continue-on-error: true
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node scripts/build-pierce-assessor.mjs --out extract-build/pierce
          rm -rf site/data/assessor/pierce
          mkdir -p site/data/assessor
          mv extract-build/pierce site/data/assessor/pierce
      - name: Keep the previously published extract when the rebuild failed
        if: steps.extract.outcome == 'failure'
        continue-on-error: true
        run: node scripts/fetch-published-extract.mjs --out site/data/assessor/pierce
      - name: Validate the Allenmore reference study against live services
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/validate-allenmore.mjs --static-base site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
